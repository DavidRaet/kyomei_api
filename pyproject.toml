[project]
name = "kyomei-api"
version = "0.1.0"
description = "FastAPI BFF for kyomei_0 — AniList-backed anime data orchestration and caching"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "clerk-backend-api>=1.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
